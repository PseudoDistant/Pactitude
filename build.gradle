plugins {
    id 'java'
    id("com.gradleup.shadow") version "9.0.0-beta8"
}

group = 'dev.pseudodistant'
version = '0.1'

repositories {
    mavenCentral()
}

dependencies {
    implementation 'commons-cli:commons-cli:1.9.0'
}

tasks.jar.enabled = false

shadowJar {
    dependencies {
        include(dependency('commons-cli:commons-cli:.*'))
    }
    manifest {
        attributes "Main-Class": "dev.pseudodistant.pactitude.Main"
    }
}

assemble.dependsOn(shadowJar)

test {
    useJUnitPlatform()
}